# Load the official InterSystems AI Hub EAP Community build 154 locally first.
# No InterSystems-derived image may be pushed to a public registry.
services:
  graphfraud-evidence:
    image: node:22-alpine
    working_dir: /work
    volumes:
      - ./src:/work/src:ro
    environment:
      HOST: 0.0.0.0
      PORT: "8787"
    command: ["node", "src/server.mjs"]
    expose:
      - "8787"
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:http').get('http://127.0.0.1:8787/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
  iris:
    build:
      context: .
      dockerfile: Dockerfile.iris
      args:
        IRIS_BASE: iris-community:2026.3.0AI.154.0
    image: graphfraud-aihub:local
    hostname: graphfraud-iris
    depends_on:
      graphfraud-evidence:
        condition: service_healthy
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "127.0.0.1:1972:1972"
    restart: unless-stopped
